<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FakeNewsHunter — Multimodal Fake News Detection</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN Script for Instant Styling and Development -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              indigo: {
                50: 'var(--indigo-50)',
                100: 'var(--indigo-100)',
                200: 'var(--indigo-200)',
                250: 'var(--indigo-250)',
                500: 'var(--indigo-500)',
                600: 'var(--indigo-600)',
                700: 'var(--indigo-700)',
                900: 'var(--indigo-900)',
                950: 'var(--indigo-950)',
              },
              violet: {
                50: 'var(--violet-50)',
                100: 'var(--violet-100)',
                200: 'var(--violet-200)',
                250: 'var(--violet-250)',
                500: 'var(--violet-500)',
                600: 'var(--violet-600)',
                700: 'var(--violet-700)',
                900: 'var(--violet-900)',
                950: 'var(--violet-950)',
              },
              slate: {
                55: '#f1f5f9',
                250: '#e2e8f0',
                350: '#94a3b8',
                355: '#cbd5e1',
                405: '#64748b',
                450: '#64748b',
                550: '#94a3b8',
                850: '#1e293b',
              },
              rose: {
                450: '#f43f5e',
              },
              emerald: {
                450: '#10b981',
              }
            },
            animation: {
              'gradient-x': 'rotateGradient 4s ease infinite',
              'scan': 'scan 2s linear infinite',
              'pulse-ring-slow': 'pulseRing 3s ease-out infinite',
            }
          }
        }
      }
    </script>

    <!-- Theme Accent Initialization Script -->
    <script>
      (function() {
        const accent = localStorage.getItem('accent-color') || 'indigo';
        document.documentElement.setAttribute('data-accent', accent);
      })();
    </script>
    <!-- DotLottie Player Web Component CDN -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
